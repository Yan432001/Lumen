<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen - Dark Pinterest & Mouse Light</title>
    <meta name="description" content="Immersive dark Pinterest-style visual discovery platform with interactive mouse spotlight effects for exploring images, reading atmospheric stories, and illuminating classic books." />
    <meta property="og:title" content="Lumen - Dark Pinterest & Mouse Light" />
    <meta property="og:description" content="Immersive dark Pinterest-style visual discovery platform with interactive mouse spotlight effects for exploring images, reading atmospheric stories, and illuminating classic books." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('lumen_theme_preference_v1');
          var theme = (saved === 'light') ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.classList.add('light-mode');
            document.documentElement.classList.remove('dark-mode');
          } else {
            document.documentElement.classList.add('dark-mode');
            document.documentElement.classList.remove('light-mode');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark-mode');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="dark-mode">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
